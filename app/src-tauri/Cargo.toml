[package]
name = "ai-quota-widget"
version = "0.1.0"
description = "A transparent desktop quota widget"
authors = ["AI Usage contributors"]
edition = "2021"

[lib]
name = "ai_quota_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
