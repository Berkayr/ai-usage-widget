[package]
name = "ai-usage-widget"
version = "0.1.0"
description = "A transparent desktop quota widget"
authors = ["AI Usage contributors"]
edition = "2021"

[[bin]]
name = "ai-usage"
path = "src/main.rs"

[lib]
name = "ai_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Already used by Tauri/Wry; matching the existing lockfile version.
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
libloading = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
