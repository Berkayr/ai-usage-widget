<!--
  DESIGN 06 (v2): COMPACT HORIZONTAL STRIP (TOP/BOTTOM SCREEN BAR)
  Fixed Widget Dimensions: 1040px × 48px
  v2 Upgrades:
  - Fixed v1 bug in Gemini segment where reset time ("1h 05m") and percent ("17%") touched each other: added explicit flex gap + margin-left on .mini-val and moved STALE pill into the second deck so all 3 providers have generous horizontal meter width.
  - Header capsule: App name on far left + last updated time right next to it; Settings gear button on far right of the strip.
  - Slide-down Settings Popover attached to the strip (Notifications OFF by default).
  - 100% CSS-variable driven colors (custom Accent + Background color pickers).
  - Dual opacity sliders (Widget Opacity + Background Opacity with crisp text) over a CSS-only desktop wallpaper scene.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 — Compact Horizontal Strip v2 (1040×48)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-stage: #07090e;
      --bg-rgb: 16, 20, 29;
      --bg-segment-rgb: 24, 31, 44;
      --widget-opacity: 1;
      --bg-opacity: 0.90;
      --bg-strip: rgba(var(--bg-rgb), var(--bg-opacity));
      --bg-segment: rgba(var(--bg-segment-rgb), var(--bg-opacity));
      --bg-track: rgba(148, 163, 184, 0.22);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(148, 163, 184, 0.24);
      --accent: #6366f1;
      --severity-normal: var(--accent);
      --severity-warning: #f59e0b;
      --severity-danger: #ef4444;
      --widget-width: 1040px;
      --widget-height: 48px;
    }

    [data-theme="light"] {
      --bg-stage: #d5dce6;
      --bg-rgb: 248, 250, 252;
      --bg-segment-rgb: 236, 241, 247;
      --bg-track: rgba(15, 23, 42, 0.14);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: rgba(15, 23, 42, 0.16);
      --accent: #4f46e5;
      --severity-normal: var(--accent);
      --severity-warning: #d97706;
      --severity-danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-stage);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 12px;
      gap: 12px;
    }

    .demo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: #141923;
      border: 1px solid #2a3449;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
      max-width: 1060px;
      z-index: 20;
    }
    .demo-toolbar .size-badge {
      color: var(--accent);
      font-weight: 700;
      padding-right: 8px;
      border-right: 1px solid #2a3449;
    }
    .demo-toolbar .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 8px;
      border-right: 1px solid #2a3449;
    }
    .demo-toolbar .toolbar-group:last-child {
      border-right: none;
      padding-right: 0;
    }
    .demo-toolbar button {
      background: #1e2636;
      color: #e2e8f0;
      border: 1px solid #35435e;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .demo-toolbar button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-color: var(--accent);
    }
    .demo-toolbar input[type="color"] {
      width: 22px;
      height: 22px;
      border: 1px solid #475569;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    .demo-toolbar input[type="range"] {
      width: 64px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .swatch-pink {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff5fa2 !important;
      border: 1px solid #fff !important;
      padding: 0 !important;
    }
    .val-readout {
      min-width: 30px;
      font-size: 10px;
      color: #94a3b8;
    }

    /* Colorful CSS-only Desktop Wallpaper Stage */
    .wallpaper-stage {
      width: 1080px;
      max-width: 100%;
      min-height: 180px;
      padding: 22px 20px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 30%, rgba(99, 102, 241, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 52% 20%, rgba(236, 72, 153, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 86% 65%, rgba(14, 165, 233, 0.50) 0%, transparent 48%),
        linear-gradient(120deg, #0b1120 0%, #1e1b4b 48%, #0f172a 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15), 0 16px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }
    .wallpaper-stage::after {
      content: "DESKTOP TOP-BAR WALLPAPER STAGE";
      position: absolute;
      bottom: 8px;
      right: 16px;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.40);
      pointer-events: none;
    }

    /* Fixed 48px Horizontal Strip */
    .widget-strip {
      width: var(--widget-width);
      max-width: 100%;
      height: var(--widget-height);
      opacity: var(--widget-opacity);
      background: var(--bg-strip);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      align-items: stretch;
      gap: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      z-index: 2;
      flex-shrink: 0;
    }

    /* Left Brand & Clock Capsule: App name far left, last updated right next to it */
    .strip-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--bg-segment);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .brand-top {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1.4px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }
    .brand-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
      padding-left: 7px;
      border-left: 1px solid var(--border-color);
    }
    .brand-time strong {
      color: var(--accent);
    }

    /* Providers Row - stretches to fill horizontal bar */
    .strip-providers {
      flex: 1;
      display: flex;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
    }

    .strip-provider {
      flex: 1;
      background: var(--bg-segment);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .strip-provider[hidden] {
      display: none !important;
    }
    .strip-provider.is-stale {
      border-color: var(--severity-danger);
    }

    .prov-id {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
      min-width: 82px;
    }
    .prov-title-line {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .prov-name {
      font-weight: 800;
      font-size: 12.5px;
      line-height: 1.1;
    }
    .prov-plan {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .prov-subtag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--text-secondary);
      line-height: 1.1;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .mini-stale {
      background: var(--severity-danger);
      color: #fff;
      font-weight: 700;
      font-size: 8px;
      padding: 0 4px;
      border-radius: 2px;
    }

    /* Inline Dual Metrics inside each horizontal segment */
    .inline-metrics {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-meter {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 0;
    }
    /* FIXED v1 BUG: explicit gap + flex layout so reset time and percentage NEVER touch */
    .mini-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1;
      white-space: nowrap;
    }
    .mini-left {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
    }
    .mini-lbl {
      color: var(--text-secondary);
      font-size: 9.5px;
      font-weight: 700;
    }
    .mini-rst {
      color: var(--text-muted);
      font-size: 9px;
    }
    .mini-val {
      font-weight: 700;
      font-size: 11.5px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .mini-val[data-severity="normal"] { color: var(--severity-normal); }
    .mini-val[data-severity="warning"] { color: var(--severity-warning); }
    .mini-val[data-severity="danger"] { color: var(--severity-danger); }

    .mini-track {
      width: 100%;
      height: 5px;
      background: var(--bg-track);
      border-radius: 99px;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      border-radius: 99px;
    }
    .mini-fill[data-severity="normal"] { background: var(--severity-normal); }
    .mini-fill[data-severity="warning"] { background: var(--severity-warning); }
    .mini-fill[data-severity="danger"] { background: var(--severity-danger); }

    /* Right-most Gear Button inside the 48px Strip */
    .gear-btn {
      width: 34px;
      background: var(--bg-segment);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .gear-btn:hover,
    .gear-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .gear-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Slide-down Settings Bar Drawer below the 48px strip */
    .settings-drawer {
      width: var(--widget-width);
      max-width: 100%;
      background: rgba(var(--bg-rgb), 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 11px;
      z-index: 10;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .settings-drawer.open {
      display: flex;
      flex-wrap: wrap;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drawer-item input[type="range"] {
      width: 75px;
      accent-color: var(--accent);
    }
    .preset-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #fff;
      cursor: pointer;
    }
    .drawer-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--accent);
      padding: 4px 9px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="demo-toolbar" role="region" aria-label="Widget Demo Controls">
    <span class="size-badge">1040×48 px</span>
    <div class="toolbar-group">
      <span>Providers:</span>
      <button type="button" class="active" data-toggle-provider="claude">Claude</button>
      <button type="button" class="active" data-toggle-provider="codex">Codex</button>
      <button type="button" class="active" data-toggle-provider="gemini">Gemini</button>
    </div>
    <div class="toolbar-group">
      <button type="button" id="themeToggle">Light / Dark</button>
      <button type="button" id="dangerSimToggle">Test &gt;80%</button>
    </div>
    <div class="toolbar-group">
      <label for="accentPicker">Accent:</label>
      <input type="color" id="accentPicker" value="#6366f1" />
      <button type="button" class="swatch-pink" id="pinkPresetBtn" title="Try Pink #ff5fa2"></button>
      <label for="bgPicker">BG:</label>
      <input type="color" id="bgPicker" value="#10141d" />
    </div>
    <div class="toolbar-group">
      <label for="widgetOpacitySlider">Widget Opacity:</label>
      <input type="range" id="widgetOpacitySlider" min="20" max="100" value="100" />
      <span class="val-readout" id="widgetOpacityVal">100%</span>
    </div>
    <div class="toolbar-group">
      <label for="bgOpacitySlider">BG Opacity:</label>
      <input type="range" id="bgOpacitySlider" min="0" max="100" value="90" />
      <span class="val-readout" id="bgOpacityVal">90%</span>
    </div>
  </div>

  <div class="wallpaper-stage">
    <main class="widget-strip">
      <!-- Left Header Capsule: App Name on far left + Last Updated right next to it -->
      <header class="strip-brand">
        <div class="brand-top"><span class="pulse-dot"></span>QUOTA</div>
        <div class="brand-time"><strong>23:41</strong></div>
      </header>

      <section class="strip-providers">
        <!-- CLAUDE -->
        <article class="strip-provider" data-provider="claude">
          <div class="prov-id">
            <div class="prov-title-line">
              <span class="prov-name">Claude</span>
              <span class="prov-plan">Max</span>
            </div>
            <div class="prov-subtag">Opus: <strong style="color:var(--severity-normal)">12%</strong></div>
          </div>

          <div class="inline-metrics">
            <div class="mini-meter" data-pct="34">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">5h</span><span class="mini-rst">2h 41m</span></span>
                <span class="mini-val">34%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>

            <div class="mini-meter" data-pct="61">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">Wk</span><span class="mini-rst">3d 4h</span></span>
                <span class="mini-val">61%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>
          </div>
        </article>

        <!-- CODEX -->
        <article class="strip-provider" data-provider="codex">
          <div class="prov-id">
            <div class="prov-title-line">
              <span class="prov-name">Codex</span>
              <span class="prov-plan">Plus</span>
            </div>
            <div class="prov-subtag">2 windows</div>
          </div>

          <div class="inline-metrics">
            <div class="mini-meter" data-pct="8">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">5h</span><span class="mini-rst">4h 10m</span></span>
                <span class="mini-val">8%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>

            <div class="mini-meter" id="codexWeeklyStrip" data-pct="77" data-default-pct="77" data-danger-pct="87">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">Wk</span><span class="mini-rst">1d 6h</span></span>
                <span class="mini-val">77%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>
          </div>
        </article>

        <!-- GEMINI (v1 collision bug fixed: STALE moved to subtag + explicit gap between 1h 05m and 17%) -->
        <article class="strip-provider is-stale" data-provider="gemini">
          <div class="prov-id">
            <div class="prov-title-line">
              <span class="prov-name">Gemini</span>
              <span class="prov-plan">AI Pro</span>
            </div>
            <div class="prov-subtag">
              <span class="mini-stale">STALE</span>
              <span>3h ago</span>
            </div>
          </div>

          <div class="inline-metrics">
            <div class="mini-meter" data-pct="17">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">5h</span><span class="mini-rst">1h 05m</span></span>
                <span class="mini-val">17%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>

            <div class="mini-meter" data-pct="7">
              <div class="mini-top">
                <span class="mini-left"><span class="mini-lbl">Wk</span><span class="mini-rst">6d</span></span>
                <span class="mini-val">7%</span>
              </div>
              <div class="mini-track"><div class="mini-fill"></div></div>
            </div>
          </div>
        </article>
      </section>

      <!-- Settings Gear Button on Far Right -->
      <button type="button" class="gear-btn" id="openSettingsBtn" title="Open Settings" aria-label="Open Settings">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </main>

    <!-- Slide-down Popover Settings Panel for the Horizontal Strip -->
    <aside class="settings-drawer" id="settingsOverlay" aria-label="Strip Settings">
      <div class="drawer-item">
        <strong style="color:var(--accent)">STRIP SETTINGS</strong>
      </div>
      <div class="drawer-item">
        <span>Accent:</span>
        <span class="preset-dot" style="background:#6366f1" data-set-accent="#6366f1"></span>
        <span class="preset-dot" style="background:#ff5fa2" data-set-accent="#ff5fa2"></span>
        <span class="preset-dot" style="background:#22c55e" data-set-accent="#22c55e"></span>
        <input type="color" id="panelAccentPicker" value="#6366f1" />
      </div>
      <div class="drawer-item">
        <span>BG:</span>
        <input type="color" id="panelBgPicker" value="#10141d" />
      </div>
      <div class="drawer-item">
        <span>Widget Opacity:</span>
        <input type="range" id="panelWidgetOpacity" min="20" max="100" value="100" />
      </div>
      <div class="drawer-item">
        <span>BG Opacity:</span>
        <input type="range" id="panelBgOpacity" min="0" max="100" value="90" />
      </div>
      <div class="drawer-item">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
          <input type="checkbox" id="notifToggle" style="accent-color:var(--accent)" />
          <span>Notifications: <strong id="notifStatusText">OFF</strong> (default)</span>
        </label>
      </div>
      <a class="drawer-link" href="09-settings.html" target="_blank" rel="noopener">Full Settings (520×720) ↗</a>
    </aside>
  </div>

  <script>
    function getSeverity(pct) {
      if (pct > 80) return 'danger';
      if (pct >= 50) return 'warning';
      return 'normal';
    }

    function hexToRgbTuple(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }

    function applyAccentColor(hex) {
      document.documentElement.style.setProperty('--accent', hex);
      document.getElementById('accentPicker').value = hex;
      document.getElementById('panelAccentPicker').value = hex;
    }

    function applyBgColor(hex) {
      const [r, g, b] = hexToRgbTuple(hex);
      const segR = Math.min(255, r + 10);
      const segG = Math.min(255, g + 12);
      const segB = Math.min(255, b + 16);
      document.documentElement.style.setProperty('--bg-rgb', `${r}, ${g}, ${b}`);
      document.documentElement.style.setProperty('--bg-segment-rgb', `${segR}, ${segG}, ${segB}`);
      document.getElementById('bgPicker').value = hex;
      document.getElementById('panelBgPicker').value = hex;
    }

    function applyWidgetOpacity(pct) {
      document.documentElement.style.setProperty('--widget-opacity', (pct / 100).toFixed(2));
      document.getElementById('widgetOpacitySlider').value = pct;
      document.getElementById('panelWidgetOpacity').value = pct;
      document.getElementById('widgetOpacityVal').textContent = pct + '%';
    }

    function applyBgOpacity(pct) {
      document.documentElement.style.setProperty('--bg-opacity', (pct / 100).toFixed(2));
      document.getElementById('bgOpacitySlider').value = pct;
      document.getElementById('panelBgOpacity').value = pct;
      document.getElementById('bgOpacityVal').textContent = pct + '%';
    }

    function updateStrip() {
      document.querySelectorAll('.mini-meter').forEach(meter => {
        const pct = Number(meter.getAttribute('data-pct'));
        const sev = getSeverity(pct);
        const val = meter.querySelector('.mini-val');
        const fill = meter.querySelector('.mini-fill');
        val.textContent = pct + '%';
        val.setAttribute('data-severity', sev);
        fill.style.width = pct + '%';
        fill.setAttribute('data-severity', sev);
      });
    }

    document.querySelectorAll('[data-toggle-provider]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-toggle-provider');
        const seg = document.querySelector(`.strip-provider[data-provider="${target}"]`);
        const activeCount = document.querySelectorAll('.strip-provider:not([hidden])').length;
        if (!seg.hasAttribute('hidden') && activeCount <= 1) return;

        const willHide = !seg.hasAttribute('hidden');
        if (willHide) {
          seg.setAttribute('hidden', '');
          btn.classList.remove('active');
        } else {
          seg.removeAttribute('hidden');
          btn.classList.add('active');
        }
      });
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      applyBgColor(next === 'dark' ? '#10141d' : '#f8fafc');
    });

    let dangerSim = false;
    document.getElementById('dangerSimToggle').addEventListener('click', (e) => {
      dangerSim = !dangerSim;
      e.currentTarget.classList.toggle('active', dangerSim);
      const meter = document.getElementById('codexWeeklyStrip');
      meter.setAttribute('data-pct', dangerSim ? meter.getAttribute('data-danger-pct') : meter.getAttribute('data-default-pct'));
      updateStrip();
    });

    document.getElementById('accentPicker').addEventListener('input', e => applyAccentColor(e.target.value));
    document.getElementById('panelAccentPicker').addEventListener('input', e => applyAccentColor(e.target.value));
    document.getElementById('pinkPresetBtn').addEventListener('click', () => applyAccentColor('#ff5fa2'));
    document.querySelectorAll('[data-set-accent]').forEach(el => {
      el.addEventListener('click', () => applyAccentColor(el.getAttribute('data-set-accent')));
    });

    document.getElementById('bgPicker').addEventListener('input', e => applyBgColor(e.target.value));
    document.getElementById('panelBgPicker').addEventListener('input', e => applyBgColor(e.target.value));

    document.getElementById('widgetOpacitySlider').addEventListener('input', e => applyWidgetOpacity(e.target.value));
    document.getElementById('panelWidgetOpacity').addEventListener('input', e => applyWidgetOpacity(e.target.value));
    document.getElementById('bgOpacitySlider').addEventListener('input', e => applyBgOpacity(e.target.value));
    document.getElementById('panelBgOpacity').addEventListener('input', e => applyBgOpacity(e.target.value));

    const settingsOverlay = document.getElementById('settingsOverlay');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    openSettingsBtn.addEventListener('click', () => {
      const isOpen = settingsOverlay.classList.toggle('open');
      openSettingsBtn.classList.toggle('active', isOpen);
    });

    document.getElementById('notifToggle').addEventListener('change', e => {
      document.getElementById('notifStatusText').textContent = e.target.checked ? 'ON' : 'OFF';
    });

    updateStrip();
  </script>
</body>
</html>
