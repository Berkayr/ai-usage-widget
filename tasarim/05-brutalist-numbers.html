<!--
  DESIGN 05: BRUTALIST HUGE NUMBERS
  Fixed Widget Dimensions: 560px × 440px
  Visual Language: Swiss neo-brutalist architectural grid, massive display numerals readable from across the room, exposed structural hairlines, hard shadows, and high-contrast severity blocks.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>05 — Brutalist Huge Numbers (560×440)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-stage: #090909;
      --bg-widget: #121212;
      --bg-cell: #181818;
      --text-primary: #f5f5f0;
      --text-secondary: #a3a39c;
      --border-strong: #f5f5f0;
      --severity-normal: #c8ff00;
      --severity-warning: #ff7a00;
      --severity-danger: #ff1e42;
      --widget-width: 560px;
      --widget-height: 440px;
    }

    [data-theme="light"] {
      --bg-stage: #d4d2c8;
      --bg-widget: #f4f1ea;
      --bg-cell: #ffffff;
      --text-primary: #0d0d0d;
      --text-secondary: #4a4a46;
      --border-strong: #0d0d0d;
      --severity-normal: #16a34a;
      --severity-warning: #ea580c;
      --severity-danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-stage);
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 14px;
    }

    .demo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: #181818;
      border: 2px solid #f5f5f0;
      padding: 8px 12px;
      font-size: 11px;
      color: #f5f5f0;
    }
    .demo-toolbar .size-badge {
      color: #c8ff00;
      font-weight: 700;
      padding-right: 6px;
      border-right: 2px solid #f5f5f0;
    }
    .demo-toolbar button {
      background: #000;
      color: #f5f5f0;
      border: 1px solid #f5f5f0;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-toolbar button.active {
      background: #c8ff00;
      color: #000;
      border-color: #c8ff00;
    }

    /* Fixed Widget Frame */
    .widget-frame {
      width: var(--widget-width);
      height: var(--widget-height);
      background: var(--bg-widget);
      border: 4px solid var(--border-strong);
      box-shadow: 8px 8px 0px var(--border-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brutal-header {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      border-bottom: 4px solid var(--border-strong);
      height: 46px;
      flex-shrink: 0;
    }
    .brand-block {
      background: var(--border-strong);
      color: var(--bg-widget);
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      padding: 0 16px;
      display: flex;
      align-items: center;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .sync-stamp {
      background: var(--severity-normal);
      color: #000;
      padding: 3px 8px;
      font-weight: 700;
    }

    /* Columns Grid */
    .brutal-columns {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      min-height: 0;
    }

    .brutal-col {
      background: var(--bg-cell);
      border-right: 3px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
    }
    .brutal-col:last-child {
      border-right: none;
    }
    .brutal-col[hidden] {
      display: none !important;
    }

    .col-head {
      padding: 10px 12px;
      border-bottom: 3px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .col-plan {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border: 2px solid var(--border-strong);
      padding: 1px 6px;
    }

    /* Giant Numeral Blocks */
    .giant-block {
      flex: 1;
      padding: 8px 12px;
      border-bottom: 2px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .giant-block:last-of-type {
      border-bottom: none;
    }

    .window-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-secondary);
      z-index: 1;
    }

    .huge-number {
      font-family: 'Archivo Black', sans-serif;
      font-size: 56px;
      line-height: 0.92;
      letter-spacing: -3px;
      margin: 4px 0;
      z-index: 1;
    }
    .huge-number .pct-sign {
      font-size: 26px;
      letter-spacing: 0;
      vertical-align: super;
    }
    .huge-number[data-severity="normal"] { color: var(--severity-normal); }
    .huge-number[data-severity="warning"] { color: var(--severity-warning); }
    .huge-number[data-severity="danger"] { color: var(--severity-danger); }

    .hard-bar {
      width: 100%;
      height: 10px;
      border: 2px solid var(--border-strong);
      background: transparent;
      z-index: 1;
    }
    .hard-fill {
      height: 100%;
    }
    .hard-fill[data-severity="normal"] { background: var(--severity-normal); }
    .hard-fill[data-severity="warning"] { background: var(--severity-warning); }
    .hard-fill[data-severity="danger"] { background: var(--severity-danger); }

    /* Footer Strip inside each provider column */
    .col-foot {
      border-top: 3px solid var(--border-strong);
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
    }
    .col-foot.extra-bar {
      background: var(--bg-widget);
    }
    .col-foot.stale-hazard {
      background: var(--severity-danger);
      color: #fff;
    }
    .stale-tag-box {
      background: #000;
      color: #fff;
      padding: 1px 5px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="demo-toolbar" role="region" aria-label="Widget Demo Controls">
    <span class="size-badge">560×440 px</span>
    <span>Providers:</span>
    <button type="button" class="active" data-toggle-provider="claude">Claude</button>
    <button type="button" class="active" data-toggle-provider="codex">Codex</button>
    <button type="button" class="active" data-toggle-provider="gemini">Gemini</button>
    <button type="button" id="themeToggle">Light / Dark</button>
    <button type="button" id="dangerSimToggle">Test &gt;80% Danger</button>
  </div>

  <main class="widget-frame">
    <header class="brutal-header">
      <div class="brand-block">QUOTA</div>
      <div class="header-meta">
        <span>TELEMETRY // RAW</span>
        <span class="sync-stamp">REFRESH 23:41</span>
      </div>
    </header>

    <section class="brutal-columns">
      <!-- CLAUDE -->
      <article class="brutal-col" data-provider="claude">
        <div class="col-head">
          <h2 class="col-title">Claude</h2>
          <span class="col-plan">Max</span>
        </div>

        <div class="giant-block" data-pct="34">
          <div class="window-top-line">
            <span>5H WINDOW</span>
            <span>RST 2h 41m</span>
          </div>
          <div class="huge-number"><span class="num-val">34</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="giant-block" data-pct="61">
          <div class="window-top-line">
            <span>WEEKLY</span>
            <span>RST 3d 4h</span>
          </div>
          <div class="huge-number"><span class="num-val">61</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="col-foot extra-bar">
          <span>Opus weekly</span>
          <span style="color:var(--severity-normal)">12% USED</span>
        </div>
      </article>

      <!-- CODEX -->
      <article class="brutal-col" data-provider="codex">
        <div class="col-head">
          <h2 class="col-title">Codex</h2>
          <span class="col-plan">Plus</span>
        </div>

        <div class="giant-block" data-pct="8">
          <div class="window-top-line">
            <span>5H WINDOW</span>
            <span>RST 4h 10m</span>
          </div>
          <div class="huge-number"><span class="num-val">8</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="giant-block" id="codexWeeklyBrutal" data-pct="77" data-default-pct="77" data-danger-pct="94">
          <div class="window-top-line">
            <span>WEEKLY</span>
            <span>RST 1d 6h</span>
          </div>
          <div class="huge-number"><span class="num-val">77</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="col-foot extra-bar">
          <span>STATUS</span>
          <span>ACTIVE</span>
        </div>
      </article>

      <!-- GEMINI -->
      <article class="brutal-col" data-provider="gemini">
        <div class="col-head">
          <h2 class="col-title">Gemini</h2>
          <span class="col-plan">AI Pro</span>
        </div>

        <div class="giant-block" data-pct="17">
          <div class="window-top-line">
            <span>5H WINDOW</span>
            <span>RST 1h 05m</span>
          </div>
          <div class="huge-number"><span class="num-val">17</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="giant-block" data-pct="7">
          <div class="window-top-line">
            <span>WEEKLY</span>
            <span>RST 6d</span>
          </div>
          <div class="huge-number"><span class="num-val">7</span><span class="pct-sign">%</span></div>
          <div class="hard-bar"><div class="hard-fill"></div></div>
        </div>

        <div class="col-foot stale-hazard">
          <span class="stale-tag-box">STALE</span>
          <span>updated 3h ago</span>
        </div>
      </article>
    </section>
  </main>

  <script>
    function getSeverity(pct) {
      if (pct > 80) return 'danger';
      if (pct >= 50) return 'warning';
      return 'normal';
    }

    function updateBrutalBlocks() {
      document.querySelectorAll('.giant-block').forEach(block => {
        const pct = Number(block.getAttribute('data-pct'));
        const sev = getSeverity(pct);
        const numContainer = block.querySelector('.huge-number');
        const numVal = block.querySelector('.num-val');
        const fill = block.querySelector('.hard-fill');
        numVal.textContent = pct;
        numContainer.setAttribute('data-severity', sev);
        fill.style.width = pct + '%';
        fill.setAttribute('data-severity', sev);
      });
    }

    document.querySelectorAll('[data-toggle-provider]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-toggle-provider');
        const col = document.querySelector(`.brutal-col[data-provider="${target}"]`);
        const activeCount = document.querySelectorAll('.brutal-col:not([hidden])').length;
        if (!col.hasAttribute('hidden') && activeCount <= 1) return;

        const willHide = !col.hasAttribute('hidden');
        if (willHide) {
          col.setAttribute('hidden', '');
          btn.classList.remove('active');
        } else {
          col.removeAttribute('hidden');
          btn.classList.add('active');
        }
      });
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    let dangerSim = false;
    document.getElementById('dangerSimToggle').addEventListener('click', (e) => {
      dangerSim = !dangerSim;
      e.currentTarget.classList.toggle('active', dangerSim);
      const block = document.getElementById('codexWeeklyBrutal');
      block.setAttribute('data-pct', dangerSim ? block.getAttribute('data-danger-pct') : block.getAttribute('data-default-pct'));
      updateBrutalBlocks();
    });

    updateBrutalBlocks();
  </script>
</body>
</html>
