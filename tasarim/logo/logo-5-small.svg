<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Minimalist Small Dot-Matrix Hourglass (16px Legible Icon Glyph) -->
  <!-- Top and Bottom Reticles -->
  <line x1="12" y1="6" x2="52" y2="6" stroke="#454556" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="58" x2="52" y2="58" stroke="#454556" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper Chamber (Dim) -->
  <circle cx="14" cy="14" r="3.6" fill="#40404C"/>
  <circle cx="23" cy="14" r="3.6" fill="#40404C"/>
  <circle cx="32" cy="14" r="3.6" fill="#40404C"/>
  <circle cx="41" cy="14" r="3.6" fill="#40404C"/>
  <circle cx="50" cy="14" r="3.6" fill="#40404C"/>

  <circle cx="23" cy="23" r="3.6" fill="#40404C"/>
  <circle cx="32" cy="23" r="3.6" fill="#40404C"/>
  <circle cx="41" cy="23" r="3.6" fill="#40404C"/>

  <!-- Neck Beacon (Signal Orange) -->
  <circle cx="32" cy="32" r="4.8" fill="#FF5A1F"/>

  <!-- Lower Chamber (Active Usage) -->
  <circle cx="23" cy="41" r="3.6" fill="#F4F4F6"/>
  <circle cx="32" cy="41" r="3.6" fill="#F4F4F6"/>
  <circle cx="41" cy="41" r="3.6" fill="#F4F4F6"/>

  <circle cx="14" cy="50" r="3.6" fill="#F4F4F6"/>
  <circle cx="23" cy="50" r="3.6" fill="#F4F4F6"/>
  <circle cx="32" cy="50" r="3.6" fill="#F4F4F6"/>
  <circle cx="41" cy="50" r="3.6" fill="#F4F4F6"/>
  <circle cx="50" cy="50" r="3.6" fill="#F4F4F6"/>
</svg>