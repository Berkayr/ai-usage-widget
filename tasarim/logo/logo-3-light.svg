<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3Light" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFCF9"/>
      <stop offset="100%" stop-color="#EBEAE4"/>
    </radialGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad3Light)" stroke="#D5D4CE" stroke-width="4"/>

  <!-- Battery Terminal Cap -->
  <rect x="216" y="94" width="80" height="20" rx="6" fill="#D2D1C8" stroke="#B8B7AF" stroke-width="3"/>

  <!-- Battery Outer Casing -->
  <rect x="144" y="124" width="224" height="288" rx="28" fill="#F0EFE9" stroke="#C8C7BE" stroke-width="5"/>

  <!-- Left Side Calibration Notches -->
  <line x1="124" y1="206" x2="136" y2="206" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="294" x2="136" y2="294" stroke="#B8B7AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="382" x2="136" y2="382" stroke="#B8B7AF" stroke-width="3" stroke-linecap="round"/>

  <!-- 4x6 Dot-Matrix Energy Grid -->
  <!-- Row 0 (Top / Remaining Capacity - Dim) -->
  <circle cx="176" cy="162" r="13" fill="#D8D7CF"/>
  <circle cx="229" cy="162" r="13" fill="#D8D7CF"/>
  <circle cx="283" cy="162" r="13" fill="#D8D7CF"/>
  <circle cx="336" cy="162" r="13" fill="#D8D7CF"/>

  <!-- Row 1 (Threshold Level - High Alert Signal Orange) -->
  <circle cx="176" cy="206" r="13" fill="#FF5A1F"/>
  <circle cx="229" cy="206" r="13" fill="#FF5A1F"/>
  <circle cx="283" cy="206" r="13" fill="#FF5A1F"/>
  <circle cx="336" cy="206" r="13" fill="#FF5A1F"/>

  <!-- Row 2 (Active Fill) -->
  <circle cx="176" cy="250" r="13" fill="#16161A"/>
  <circle cx="229" cy="250" r="13" fill="#16161A"/>
  <circle cx="283" cy="250" r="13" fill="#16161A"/>
  <circle cx="336" cy="250" r="13" fill="#16161A"/>

  <!-- Row 3 (Active Fill) -->
  <circle cx="176" cy="294" r="13" fill="#16161A"/>
  <circle cx="229" cy="294" r="13" fill="#16161A"/>
  <circle cx="283" cy="294" r="13" fill="#16161A"/>
  <circle cx="336" cy="294" r="13" fill="#16161A"/>

  <!-- Row 4 (Active Fill) -->
  <circle cx="176" cy="338" r="13" fill="#16161A"/>
  <circle cx="229" cy="338" r="13" fill="#16161A"/>
  <circle cx="283" cy="338" r="13" fill="#16161A"/>
  <circle cx="336" cy="338" r="13" fill="#16161A"/>

  <!-- Row 5 (Base / Active Fill) -->
  <circle cx="176" cy="382" r="13" fill="#16161A"/>
  <circle cx="229" cy="382" r="13" fill="#16161A"/>
  <circle cx="283" cy="382" r="13" fill="#16161A"/>
  <circle cx="336" cy="382" r="13" fill="#16161A"/>
</svg>