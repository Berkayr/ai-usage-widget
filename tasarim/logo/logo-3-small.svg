<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Minimalist Small Dot-Matrix Battery Icon (16px Legible Icon Glyph) -->
  <!-- Battery Top Cap -->
  <rect x="26" y="5" width="12" height="4" rx="1.5" fill="#505060"/>

  <!-- Battery Outer Housing -->
  <rect x="14" y="11" width="36" height="47" rx="6" fill="none" stroke="#404050" stroke-width="3"/>

  <!-- Internal Dot Matrix Meter (2x4) -->
  <!-- Top Row (Dim) -->
  <circle cx="26" cy="20" r="3.8" fill="#40404C"/>
  <circle cx="38" cy="20" r="3.8" fill="#40404C"/>

  <!-- Warning Level (Signal Orange) -->
  <circle cx="26" cy="29" r="4" fill="#FF5A1F"/>
  <circle cx="38" cy="29" r="4" fill="#FF5A1F"/>

  <!-- Lower Rows (Active) -->
  <circle cx="26" cy="38" r="3.8" fill="#F4F4F6"/>
  <circle cx="38" cy="38" r="3.8" fill="#F4F4F6"/>

  <circle cx="26" cy="47" r="3.8" fill="#F4F4F6"/>
  <circle cx="38" cy="47" r="3.8" fill="#F4F4F6"/>
</svg>