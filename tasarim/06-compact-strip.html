<!--
  DESIGN 06: COMPACT HORIZONTAL STRIP (TOP/BOTTOM SCREEN BAR)
  Fixed Widget Dimensions: 1040px × 48px
  Visual Language: Ultra-dense polybar/waybar style desktop status strip (48px tall) with dual-deck inline micro-meters and instant glanceable numerals.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 — Compact Horizontal Strip (1040×48)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-stage: #07090e;
      --bg-strip: #10141d;
      --bg-segment: #171d29;
      --bg-track: #273145;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #263147;
      --accent: #6366f1;
      --severity-normal: #22c55e;
      --severity-warning: #f59e0b;
      --severity-danger: #ef4444;
      --widget-width: 1040px;
      --widget-height: 48px;
    }

    [data-theme="light"] {
      --bg-stage: #d5dce6;
      --bg-strip: #f8fafc;
      --bg-segment: #eef2f6;
      --bg-track: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --accent: #4f46e5;
      --severity-normal: #16a34a;
      --severity-warning: #d97706;
      --severity-danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-stage);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      gap: 20px;
    }

    .demo-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: #141923;
      border: 1px solid #2a3449;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .demo-toolbar .size-badge {
      color: #818cf8;
      font-weight: 700;
      padding-right: 6px;
      border-right: 1px solid #2a3449;
    }
    .demo-toolbar button {
      background: #1e2636;
      color: #e2e8f0;
      border: 1px solid #35435e;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .demo-toolbar button.active {
      background: #6366f1;
      color: #fff;
      border-color: #818cf8;
    }

    /* Fixed 48px Horizontal Strip */
    .widget-strip {
      width: var(--widget-width);
      max-width: 100%;
      height: var(--widget-height);
      background: var(--bg-strip);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: stretch;
      gap: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* Left Brand & Clock Capsule */
    .strip-brand {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10px;
      background: var(--bg-segment);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      flex-shrink: 0;
    }
    .brand-top {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .brand-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Providers Row - stretches to fill horizontal bar */
    .strip-providers {
      flex: 1;
      display: flex;
      align-items: stretch;
      gap: 8px;
      min-width: 0;
    }

    .strip-provider {
      flex: 1;
      background: var(--bg-segment);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .strip-provider[hidden] {
      display: none !important;
    }
    .strip-provider.is-stale {
      border-color: var(--severity-danger);
    }

    .prov-id {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }
    .prov-title-line {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .prov-name {
      font-weight: 800;
      font-size: 13px;
      line-height: 1.1;
    }
    .prov-plan {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(99, 102, 241, 0.16);
      color: var(--accent);
    }
    .prov-subtag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--text-secondary);
      line-height: 1.1;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-stale {
      background: var(--severity-danger);
      color: #fff;
      font-weight: 700;
      font-size: 8.5px;
      padding: 0 4px;
      border-radius: 2px;
    }

    /* Inline Dual Metrics inside each horizontal segment */
    .inline-metrics {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mini-meter {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      min-width: 0;
    }
    .mini-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .mini-lbl {
      color: var(--text-secondary);
      font-size: 9.5px;
    }
    .mini-rst {
      color: var(--text-muted);
      font-size: 9px;
      margin-left: 3px;
    }
    .mini-val {
      font-weight: 700;
      font-size: 12px;
    }
    .mini-val[data-severity="normal"] { color: var(--severity-normal); }
    .mini-val[data-severity="warning"] { color: var(--severity-warning); }
    .mini-val[data-severity="danger"] { color: var(--severity-danger); }

    .mini-track {
      width: 100%;
      height: 6px;
      background: var(--bg-track);
      border-radius: 99px;
      overflow: hidden;
    }
    .mini-fill {
      height: 100%;
      border-radius: 99px;
    }
    .mini-fill[data-severity="normal"] { background: var(--severity-normal); }
    .mini-fill[data-severity="warning"] { background: var(--severity-warning); }
    .mini-fill[data-severity="danger"] { background: var(--severity-danger); }
  </style>
</head>
<body>

  <div class="demo-toolbar" role="region" aria-label="Widget Demo Controls">
    <span class="size-badge">1040×48 px</span>
    <span>Providers:</span>
    <button type="button" class="active" data-toggle-provider="claude">Claude</button>
    <button type="button" class="active" data-toggle-provider="codex">Codex</button>
    <button type="button" class="active" data-toggle-provider="gemini">Gemini</button>
    <button type="button" id="themeToggle">Light / Dark</button>
    <button type="button" id="dangerSimToggle">Test &gt;80% Danger</button>
  </div>

  <main class="widget-strip">
    <header class="strip-brand">
      <div class="brand-top"><span class="pulse-dot"></span>QUOTA</div>
      <div class="brand-time">SYNC 23:41</div>
    </header>

    <section class="strip-providers">
      <!-- CLAUDE -->
      <article class="strip-provider" data-provider="claude">
        <div class="prov-id">
          <div class="prov-title-line">
            <span class="prov-name">Claude</span>
            <span class="prov-plan">Max</span>
          </div>
          <div class="prov-subtag">Opus weekly: <strong style="color:var(--severity-normal)">12%</strong></div>
        </div>

        <div class="inline-metrics">
          <div class="mini-meter" data-pct="34">
            <div class="mini-top">
              <span><span class="mini-lbl">5h</span><span class="mini-rst">2h 41m</span></span>
              <span class="mini-val">34%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>

          <div class="mini-meter" data-pct="61">
            <div class="mini-top">
              <span><span class="mini-lbl">Wk</span><span class="mini-rst">3d 4h</span></span>
              <span class="mini-val">61%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>
        </div>
      </article>

      <!-- CODEX -->
      <article class="strip-provider" data-provider="codex">
        <div class="prov-id">
          <div class="prov-title-line">
            <span class="prov-name">Codex</span>
            <span class="prov-plan">Plus</span>
          </div>
          <div class="prov-subtag">2 windows</div>
        </div>

        <div class="inline-metrics">
          <div class="mini-meter" data-pct="8">
            <div class="mini-top">
              <span><span class="mini-lbl">5h</span><span class="mini-rst">4h 10m</span></span>
              <span class="mini-val">8%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>

          <div class="mini-meter" id="codexWeeklyStrip" data-pct="77" data-default-pct="77" data-danger-pct="87">
            <div class="mini-top">
              <span><span class="mini-lbl">Wk</span><span class="mini-rst">1d 6h</span></span>
              <span class="mini-val">77%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>
        </div>
      </article>

      <!-- GEMINI -->
      <article class="strip-provider is-stale" data-provider="gemini">
        <div class="prov-id">
          <div class="prov-title-line">
            <span class="prov-name">Gemini</span>
            <span class="prov-plan">AI Pro</span>
            <span class="mini-stale">STALE</span>
          </div>
          <div class="prov-subtag">updated 3h ago</div>
        </div>

        <div class="inline-metrics">
          <div class="mini-meter" data-pct="17">
            <div class="mini-top">
              <span><span class="mini-lbl">5h</span><span class="mini-rst">1h 05m</span></span>
              <span class="mini-val">17%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>

          <div class="mini-meter" data-pct="7">
            <div class="mini-top">
              <span><span class="mini-lbl">Wk</span><span class="mini-rst">6d</span></span>
              <span class="mini-val">7%</span>
            </div>
            <div class="mini-track"><div class="mini-fill"></div></div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    function getSeverity(pct) {
      if (pct > 80) return 'danger';
      if (pct >= 50) return 'warning';
      return 'normal';
    }

    function updateStrip() {
      document.querySelectorAll('.mini-meter').forEach(meter => {
        const pct = Number(meter.getAttribute('data-pct'));
        const sev = getSeverity(pct);
        const val = meter.querySelector('.mini-val');
        const fill = meter.querySelector('.mini-fill');
        val.textContent = pct + '%';
        val.setAttribute('data-severity', sev);
        fill.style.width = pct + '%';
        fill.setAttribute('data-severity', sev);
      });
    }

    document.querySelectorAll('[data-toggle-provider]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-toggle-provider');
        const seg = document.querySelector(`.strip-provider[data-provider="${target}"]`);
        const activeCount = document.querySelectorAll('.strip-provider:not([hidden])').length;
        if (!seg.hasAttribute('hidden') && activeCount <= 1) return;

        const willHide = !seg.hasAttribute('hidden');
        if (willHide) {
          seg.setAttribute('hidden', '');
          btn.classList.remove('active');
        } else {
          seg.removeAttribute('hidden');
          btn.classList.add('active');
        }
      });
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    let dangerSim = false;
    document.getElementById('dangerSimToggle').addEventListener('click', (e) => {
      dangerSim = !dangerSim;
      e.currentTarget.classList.toggle('active', dangerSim);
      const meter = document.getElementById('codexWeeklyStrip');
      meter.setAttribute('data-pct', dangerSim ? meter.getAttribute('data-danger-pct') : meter.getAttribute('data-default-pct'));
      updateStrip();
    });

    updateStrip();
  </script>
</body>
</html>
