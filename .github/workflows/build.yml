name: Build release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Reviewed release tag to build
permissions:
  contents: read
concurrency:
  group: bundles-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  bundle:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage,deb,rpm
            config-args: ''
          - os: windows-latest
            platform: windows-x86_64-with-python
            bundles: nsis,msi
            config-args: '--config src-tauri/tauri.with-python.conf.json'
            embedded-python: true
          - os: windows-latest
            platform: windows-x86_64-slim
            bundles: nsis,msi
            config-args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; Rust 1.99.1
        with:
          toolchain: 1.99.1
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
        working-directory: app
      - name: Fetch and verify official embedded Python (SHA-256 and Authenticode)
        if: matrix.embedded-python == true
        shell: pwsh
        run: ./scripts/fetch-python.ps1
      - name: Build platform bundles
        run: npm run tauri -- build --locked --bundles ${{ matrix.bundles }} ${{ matrix.config-args }}
        working-directory: app
        env:
          NO_STRIP: 'true'
      - name: Stage installers
        shell: bash
        env:
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path('app/src-tauri/target/release/bundle')
          out = pathlib.Path('release-artifacts')
          out.mkdir()
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.exe', '.msi', '.appimage', '.deb', '.rpm'}]
          expected = {'.exe', '.msi'} if os.environ['BUNDLE_PLATFORM'].startswith('windows') else {'.appimage', '.deb', '.rpm'}
          assert expected <= {p.suffix.lower() for p in files}, 'Missing installer format'
          for path in files:
              shutil.copy2(path, out / (os.environ['BUNDLE_PLATFORM'] + '-' + path.name))
          PY
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  attach:
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-artifacts
      - name: Generate SHA-256 checksums
        run: |
          python - <<'PY'
          import hashlib, pathlib
          out = pathlib.Path('release-artifacts')
          files = sorted(p for p in out.iterdir() if p.is_file())
          assert len(files) == 7, 'Expected Linux installers and both Windows editions'
          (out / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, name: tag, draft: true, generate_release_notes: true})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id});
            for (const name of fs.readdirSync('release-artifacts').sort()) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync(`release-artifacts/${name}`)});
            }
