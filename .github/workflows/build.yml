name: Build release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        required: false
        type: string
        description: Reviewed release tag to build
permissions:
  contents: read
concurrency:
  group: bundles-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  bundle:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage,deb,rpm
            config-args: ''
          - os: windows-latest
            platform: windows-x86_64-with-python
            bundles: nsis,msi
            config-args: '--config src-tauri/tauri.with-python.conf.json'
            embedded-python: true
          - os: windows-latest
            platform: windows-x86_64-slim
            bundles: nsis,msi
            config-args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; Rust 1.99.1
        with:
          toolchain: 1.99.1
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
        working-directory: app
      - name: Fetch and verify official embedded Python (SHA-256 and Authenticode)
        if: matrix.embedded-python == true
        shell: pwsh
        run: ./scripts/fetch-python.ps1
      - name: Build platform bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.config-args }} -- --locked
        working-directory: app
        env:
          NO_STRIP: 'true'
      - name: Stage installers
        shell: bash
        env:
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path('app/src-tauri/target/release/bundle')
          out = pathlib.Path('release-artifacts')
          out.mkdir()
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.exe', '.msi', '.appimage', '.deb', '.rpm'}]
          expected = {'.exe', '.msi'} if os.environ['BUNDLE_PLATFORM'].startswith('windows') else {'.appimage', '.deb', '.rpm'}
          assert expected <= {p.suffix.lower() for p in files}, 'Missing installer format'
          for path in files:
              shutil.copy2(path, out / (os.environ['BUNDLE_PLATFORM'] + '-' + path.name))
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  attach:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: [bundle, install-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-artifacts
      - name: Generate SHA-256 checksums
        run: |
          python - <<'PY'
          import hashlib, pathlib
          out = pathlib.Path('release-artifacts')
          files = sorted(p for p in out.iterdir() if p.is_file())
          assert len(files) == 7, 'Expected Linux installers and both Windows editions'
          (out / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            if (!tag) core.setFailed('A release tag is required to attach artifacts');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, name: tag, draft: true, generate_release_notes: true})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id});
            for (const name of fs.readdirSync('release-artifacts').sort()) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync(`release-artifacts/${name}`)});
            }
  install-smoke:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-linux-x86_64
          path: release-artifacts
      - name: Generate installer checksums
        working-directory: release-artifacts/installers-linux-x86_64
        run: sha256sum *.deb *.rpm *.AppImage > SHA256SUMS.txt
      - name: Install and launch deb, then AppImage
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DEB=$(find release-artifacts -name '*.deb' -print -quit)
          APPIMAGE=$(find release-artifacts -name '*.AppImage' -print -quit)
          sudo apt-get update
          sudo apt-get install -y xvfb
          scripts/install.sh --from-dir "$(dirname "$DEB")"
          xvfb-run sh -c 'timeout 20 ai-usage; test $? -eq 124'
          scripts/install.sh --uninstall
          APPDIR=$(mktemp -d)
          cp "$APPIMAGE" "$APPDIR/"
          (cd "$APPDIR" && sha256sum "$(basename "$APPIMAGE")" > SHA256SUMS.txt)
          scripts/install.sh --from-dir "$APPDIR"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run sh -c 'timeout 20 "$HOME/.local/bin/ai-usage.AppImage"; test $? -eq 124'
          scripts/install.sh --uninstall
      - name: Install rpm in Fedora container
        run: |
          RPM=$(find release-artifacts -name '*.rpm' -print -quit)
          docker run --rm -v "$PWD:/work" -w /work fedora:latest sh -c 'dnf install -y sudo findutils gawk && /work/scripts/install.sh --from-dir /work/release-artifacts/installers-linux-x86_64'
