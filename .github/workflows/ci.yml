name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; Rust 1.99.1
        with:
          toolchain: 1.99.1
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf
      - name: Python tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests
      - name: Security boundary tests (including Windows ACLs)
        run: python -m unittest discover -s tests -p test_security.py
      - run: npm ci
        working-directory: app
      - name: Renderer security tests
        run: node tests/render-security.mjs
      - name: Check AUR draft checksums
        shell: bash
        run: |
          if grep -R "SKIP" packaging/aur; then echo "::warning::AUR checksum verification is disabled"; fi
      - run: npm run build
        working-directory: app
      - run: cargo check --locked
        working-directory: app/src-tauri
