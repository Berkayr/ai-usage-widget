name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; Rust 1.99.1
        with:
          toolchain: 1.99.1
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf
      - name: Python tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests
      - name: Security boundary tests (including Windows ACLs)
        run: python -m unittest discover -s tests -p test_security.py
      - run: npm ci
        working-directory: app
      - name: Linux bundle staging regression
        run: node tests/linux-bundle.mjs
      - name: Renderer security tests
        run: node tests/render-security.mjs
      - name: Check AUR draft checksums
        shell: bash
        run: |
          if grep -R "SKIP" packaging/aur; then echo "::warning::AUR checksum verification is disabled"; fi
      - run: npm run build
        working-directory: app
      - name: Headless controls and behavior acceptance
        if: runner.os == 'Linux'
        run: node docs/tools/acceptance/run.mjs
      - name: Native driver failure diagnostics regression
        if: runner.os == 'Linux'
        run: node --test tests/native-webdriver.mjs
      - run: cargo check --locked
        working-directory: app/src-tauri
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Native driver and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf webkit2gtk-driver xvfb openbox x11-utils
          cargo install tauri-driver --version 2.1.0 --locked
      - run: npm ci
        working-directory: app
      - name: Build debug binary with embedded frontend
        run: npx tauri build --debug --no-bundle
        working-directory: app
      - name: Drive actual windows under Xvfb (X11)
        run: |
          mkdir -p native-artifacts
          xvfb-run -a -s '-screen 0 1920x1080x24' sh -eu -c '
            openbox >native-artifacts/window-manager.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then
                echo "Openbox ready under Xvfb"
                wm_ready=1
                break
              fi
              sleep 0.1
            done
            if [ "${wm_ready:-0}" != 1 ]; then cat native-artifacts/window-manager.log; exit 1; fi
            node docs/tools/acceptance/native-webdriver.mjs
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-linux
          path: native-artifacts/
  native-windows:
    needs: native-linux
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - name: Install pinned Tauri driver and matching Edge driver
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          $driverDir = Join-Path $env:RUNNER_TEMP 'edge-driver'
          $zip = Join-Path $env:RUNNER_TEMP 'edge-driver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $driverDir
          $driverDir | Out-File $env:GITHUB_PATH -Append
      - run: npm ci
        working-directory: app
      - name: Build debug binary with embedded frontend
        run: npx tauri build --debug --no-bundle
        working-directory: app
      - name: Drive actual WebView2 windows
        run: node docs/tools/acceptance/native-webdriver.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-windows
          path: native-artifacts/
